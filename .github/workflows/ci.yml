name: ci

on:
  push:
  pull_request:

jobs:
  # 单一 job：顺序执行，便于确认「初始化 → 迁移 → 单测 → 集成 → E2E」的真实顺序。
  # 数据库拓扑：应用库与集成测试库是两个**不同**的数据库，且都在本 job 内显式配置。
  # `nexus` 只作为应用默认库；集成测试目标永远是专用测试库 `nexus_test`。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          # 应用库（供 core 服务与 e2e 使用）
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      # 应用迁移目标（显式）
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus
      # 集成测试目标（显式，专用库；与 DATABASE_URL 不同）
      TEST_DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus_test
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile

      - name: Assert database topology (explicit, non-overlapping targets)
        run: node scripts/assert-ci-db-topology.mjs

      - name: Create dedicated test database
        run: corepack pnpm db:test:create

      - name: Migrate application database
        env:
          DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus
        run: corepack pnpm --filter @nexus/db db:migrate

      - name: Migrate dedicated test database
        env:
          TEST_DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus_test
        run: corepack pnpm db:test:migrate

      - run: corepack pnpm typecheck

      - name: Unit tests (no database required)
        run: corepack pnpm test:unit

      - name: Integration tests (dedicated test database only)
        env:
          TEST_DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus_test
        run: corepack pnpm test:integration

      - run: corepack pnpm --filter @nexus/web build

      - run: corepack pnpm --filter @nexus/web exec playwright install --with-deps chromium

      - name: E2E (application database, mock LLM)
        env:
          DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus
        run: corepack pnpm --filter @nexus/web test:e2e
